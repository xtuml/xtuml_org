---
layout: default
---
<article>
  {% if page.date %}
  <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.tags and page.tags != empty %} · {{ page.tags | join: " · " }}{% endif %}</p>
  {% endif %}
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
