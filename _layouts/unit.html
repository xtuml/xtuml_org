---
layout: default
---
<article>
  <p class="kicker"><a href="{{ page.course_url | relative_url }}">{{ page.course_title | default: "Modeling with xtUML" }}</a> · {{ page.module }} · {{ page.unit }}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  {% if page.youtube %}
  <figure class="video">
    <iframe src="{{ page.youtube_embed }}" title="{{ page.title | escape }}" allowfullscreen loading="lazy"></iframe>
    <figcaption><a href="{{ page.youtube }}">Watch on YouTube</a></figcaption>
  </figure>
  {% endif %}
  <nav class="unit-nav" aria-label="Lesson">
    <span class="prev">{% if page.prev %}<a href="{{ page.prev | relative_url }}">{{ page.prev_title }}</a>{% endif %}</span>
    <span class="next">{% if page.next %}<a href="{{ page.next | relative_url }}">{{ page.next_title }}</a>{% endif %}</span>
  </nav>
</article>
