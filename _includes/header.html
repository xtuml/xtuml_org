<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      xtUML
      <svg class="mark" viewBox="0 0 38 38" aria-hidden="true">
        <rect x="0" y="0" width="8" height="8" fill="#5aff5a"/>
        <rect x="10" y="0" width="8" height="8" fill="#21d621"/>
        <rect x="20" y="0" width="8" height="8" fill="#18b518"/>
        <rect x="30" y="0" width="8" height="8" fill="#107310"/>
        <rect x="10" y="10" width="8" height="8" fill="#5aff5a"/>
        <rect x="20" y="10" width="8" height="8" fill="#21d621"/>
        <rect x="30" y="10" width="8" height="8" fill="#18b518"/>
        <rect x="20" y="20" width="8" height="8" fill="#5aff5a"/>
        <rect x="30" y="20" width="8" height="8" fill="#21d621"/>
        <rect x="30" y="30" width="8" height="8" fill="#5aff5a"/>
      </svg>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {% assign here = page.url %}
      <a href="{{ '/getting-started/' | relative_url }}" {% if here contains '/getting-started' %}aria-current="page"{% endif %}>Start</a>
      <a href="{{ '/learn/' | relative_url }}" {% if here contains '/learn/' %}aria-current="page"{% endif %}>Learn</a>
      <a href="{{ '/download/' | relative_url }}" {% if here contains '/download' %}aria-current="page"{% endif %}>Download</a>
      <a href="{{ '/articles/' | relative_url }}" {% if here contains '/articles/' %}aria-current="page"{% endif %}>News</a>
      <a href="{{ '/forums/' | relative_url }}" {% if here contains '/forums/' %}aria-current="page"{% endif %}>Forum</a>
      <a href="{{ '/about/' | relative_url }}" {% if here contains '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
